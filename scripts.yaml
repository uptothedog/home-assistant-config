text_to_speech_on_sonos:
  alias: Text-to-Speech on Sonos
  use_blueprint:
    path: Talvish/sonos_say.yaml
    input:
      tts_service_name: cloud.say
  icon: mdi:account-voice
  mode: single
apply_lights:
  alias: Apply Lights
  mode: restart
  max_exceeded: silent
  fields:
    scene:
      description: Scene to apply. Omit to pick by time of day.
      selector:
        entity:
          filter:
            domain: scene
    passes:
      description: How many times to apply it. Fewer is snappier.
      selector:
        number:
          min: 1
          max: 5
  sequence:
  - variables:
      chosen: "{%- if scene is defined and scene -%}\n  {{ scene }}\n{%- else -%}\n
        \ {%- set n = now() -%}\n  {%- set day = today_at('05:00') -%}\n  {%- set
        eve = today_at('18:00') -%}\n  {%- set night = today_at('23:30') -%}\n  {{
        'scene.daytime' if day <= n < eve\n     else 'scene.evening' if eve <= n <
        night\n     else 'scene.late_night' }}\n{%- endif -%}"
  - if:
    - condition: template
      value_template: '{{ chosen != ''scene.movie'' }}'
    then:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.movie_mode_on
  - repeat:
      count: '{{ passes | default(3) | int }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ repeat.index > 1 }}'
        then:
        - delay:
            milliseconds: 400
      - action: scene.turn_on
        target:
          entity_id: '{{ chosen }}'
cycle_lights_scene:
  alias: Cycle Lights Scene
  mode: queued
  max: 4
  fields:
    step:
      description: 1 for forward, -1 for backward
  sequence:
  - variables:
      order:
      - scene.daytime
      - scene.evening
      - scene.late_night
  - variables:
      dir: '{{ step | default(1) | int }}'
  - variables:
      next_scene: "{%- set ns = namespace(best=-1, idx=-1) -%} {%- for e in order
        -%}\n  {%- set t = as_timestamp(states(e), 0) -%}\n  {%- if t > ns.best -%}{%-
        set ns.best = t -%}{%- set ns.idx = loop.index0 -%}{%- endif -%}\n{%- endfor
        -%} {{ order[(ns.idx + dir) % (order | count)] }}"
  - action: script.apply_lights
    data:
      scene: '{{ next_scene }}'
      passes: 1
pull_config:
  alias: Pull Config
  description: Pulls the latest config from GitHub, reloads automations, scripts,
    scenes, helpers and templates, and sends the result to the phone.
  icon: mdi:source-pull
  mode: single
  sequence:
  - action: shell_command.git_pull
    response_variable: pull
  - if:
    - condition: template
      value_template: '{{ pull.returncode == 0 }}'
    then:
    - action: automation.reload
    - action: scene.reload
    - action: input_boolean.reload
    - action: template.reload
    - action: notify.mobile_app_zflip7
      data:
        title: Config pulled
        message: '{{ (pull.stdout | trim).split(''\n'') | last | truncate(200) }}'
        data:
          tag: pull-config
    - action: script.reload
    else:
    - action: notify.mobile_app_zflip7
      data:
        title: Config pull failed
        message: '{{ (pull.stderr ~ '' '' ~ pull.stdout) | trim | truncate(250) }}'
        data:
          tag: pull-config
announce:
  alias: Announce
  description: Speaks a message in the room Olli is in. The AI rewords it so it
    isn't the same every time (urgent messages are read as written). Living room
    = Sonos (music dips and comes back), bedroom = Echo. Nothing is spoken when
    Olli is away, and between 23:00 and 07:00 only urgent messages are spoken.
  icon: mdi:bullhorn
  mode: queued
  max: 10
  fields:
    message:
      name: Message
      description: What happened, in plain words. Also used as-is if the AI fails.
      required: true
      example: The washing machine is done.
      selector:
        text:
    details:
      name: Details
      description: Extra facts the AI can work in.
      example: The cycle took 1 hour 42 minutes.
      selector:
        text:
    priority:
      name: Priority
      description: urgent is read word for word, on both speakers, louder, even
        in quiet hours.
      default: normal
      selector:
        select:
          options:
          - low
          - normal
          - urgent
    room:
      name: Room
      default: auto
      selector:
        select:
          options:
          - auto
          - living_room
          - bedroom
          - both
    ignore_quiet_hours:
      name: Ignore quiet hours
      default: false
      selector:
        boolean:
  sequence:
  - variables:
      prio: '{{ priority | default(''normal'') }}'
      where: >-
        {% set r = room | default('auto') %}
        {% set m = states.binary_sensor.living_room_motion %}
        {% if r != 'auto' %}{{ r }}
        {% elif prio == 'urgent' %}both
        {% elif is_state('binary_sensor.in_bed', 'on') %}bedroom
        {% elif (now().hour * 60 + now().minute >= 22 * 60 + 30 or now().hour < 9)
             and m is not none and m.state == 'off'
             and now() - m.last_changed > timedelta(minutes=20) %}bedroom
        {% else %}living_room{% endif %}
      quiet: '{{ now().hour >= 23 or now().hour < 7 }}'
      night: '{{ now().hour >= 22 or now().hour < 8 }}'
      text: '{{ message }}'
  - condition: state
    entity_id: person.olli
    state: home
  - condition: template
    value_template: '{{ not quiet or prio == ''urgent'' or ignore_quiet_hours | default(false)
      }}'
  - if:
    - condition: template
      value_template: '{{ prio != ''urgent'' }}'
    then:
    - action: ai_task.generate_data
      continue_on_error: true
      data:
        task_name: announce
        entity_id: ai_task.openai_ai_task
        instructions: >-
          You are the voice of Olli's home. Write one short sentence to be read
          aloud (two at most if there's more to say, under 40 words in total)
          that tells Olli: {{ message }}
          {% if details | default('') %}Details: {{ details }}{% endif %}

          Context, use only if it fits: it's {{ now().strftime('%A %H:%M') }},
          {{ state_attr('weather.forecast_home', 'temperature') }} °C and
          {{ states('weather.forecast_home') | replace('-', ' ') }} outside.

          Tone: neutral and clear; a light touch of playfulness is fine
          {%- if night %}, but keep it calm, it's night{% endif %}.
          Use Olli's name only now and then. Write numbers and units the way
          they are spoken. No emojis, lists, abbreviations or quotation marks.
          Don't reuse the wording of the previous announcement: "{{ states('input_text.last_announcement') }}".
          Reply with only the sentence.
      response_variable: ai
    - variables:
        text: '{{ ai.data | trim if ai is defined and ai.data is string and ai.data
          | trim | length > 0 else message }}'
  - variables:
      sonos_volume: '{{ 50 if prio == ''urgent'' else (25 if night else 35) }}'
      echo_volume: '{{ 0.7 if prio == ''urgent'' else (0.3 if night else 0.45) }}'
  - parallel:
    - if:
      - condition: template
        value_template: '{{ where in [''living_room'', ''both''] }}'
      then:
      - action: media_player.play_media
        continue_on_error: true
        target:
          entity_id: media_player.sonos
        data:
          media_content_id: media-source://tts/tts.home_assistant_cloud?message={{
            text | urlencode }}&language=en-IE&voice=EmilyNeural
          media_content_type: music
          announce: true
          extra:
            volume: '{{ sonos_volume }}'
    - if:
      - condition: template
        value_template: '{{ where in [''bedroom'', ''both''] }}'
      then:
      - action: media_player.volume_set
        continue_on_error: true
        target:
          entity_id: media_player.olli_s_echo_dot
        data:
          volume_level: '{{ echo_volume }}'
      - action: notify.alexa_media_olli_s_echo_dot
        continue_on_error: true
        data:
          message: '{{ text }}'
          data:
            type: tts
  - action: input_text.set_value
    target:
      entity_id: input_text.last_announcement
    data:
      value: '{{ text[:255] }}'
