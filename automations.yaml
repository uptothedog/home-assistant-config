- id: '1789600000001'
  alias: Alarm
  description: 'Alarmo flow. Arms when Olli has been away 10 min (door closed, not
    in bed). Entry delay: announcement on the speaker. Triggered: phone notification
    with a Disarm button, flashing lights, siren only in away mode and only after
    60 s without disarm. Disarm restores the lights. Disabled by initial_state: remove
    that line to enable.'
  initial_state: false
  triggers:
  - trigger: state
    entity_id: person.olli
    from: home
    to: not_home
    for:
      minutes: 10
    id: left_home
  - trigger: state
    entity_id: alarm_control_panel.alarmo
    to: pending
    id: entry_delay
  - trigger: state
    entity_id: alarm_control_panel.alarmo
    to: triggered
    id: triggered
  - trigger: state
    entity_id: alarm_control_panel.alarmo
    from:
    - triggered
    - pending
    to: disarmed
    id: disarmed
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: ALARM_DISARM
    id: disarm_button
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: left_home
      - condition: state
        entity_id: alarm_control_panel.alarmo
        state: disarmed
      - condition: state
        entity_id: binary_sensor.front_door
        state: 'off'
      - condition: not
        conditions:
        - condition: state
          entity_id: binary_sensor.in_bed
          state: 'on'
      sequence:
      - action: alarm_control_panel.alarm_arm_away
        target:
          entity_id: alarm_control_panel.alarmo
      - action: notify.mobile_app_zflip7
        data:
          title: Alarm armed
          message: You left home, so the alarm is now armed.
          data:
            actions:
            - action: ALARM_DISARM
              title: Disarm
    - conditions:
      - condition: trigger
        id: entry_delay
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.hub_caution
      - action: tts.speak
        target:
          entity_id: tts.home_assistant_cloud
        data:
          media_player_entity_id: media_player.living_room_speaker
          message: Please enter the code to disable the alarm.
          cache: true
        continue_on_error: true
    - conditions:
      - condition: trigger
        id: triggered
      sequence:
      - action: notify.mobile_app_zflip7
        data:
          title: Alarm triggered
          message: The home alarm has been triggered. Check the front door camera.
          data:
            ttl: 0
            priority: high
            channel: alarm_stream
            actions:
            - action: ALARM_DISARM
              title: Disarm
      - action: scene.create
        data:
          scene_id: before_alarm
          snapshot_entities:
          - light.living_room_ceiling
          - light.entryway_ceiling_light
          - light.floor_lights
          - light.kitchen_led
      - parallel:
        - repeat:
            while:
            - condition: state
              entity_id: alarm_control_panel.alarmo
              state: triggered
            - condition: template
              value_template: '{{ repeat.index <= 300 }}'
            sequence:
            - action: scene.turn_on
              target:
                entity_id: scene.alarm
            - delay:
                seconds: 1
            - action: scene.turn_on
              target:
                entity_id: scene.all_off
            - delay:
                seconds: 1
        - if:
          - condition: template
            value_template: '{{ state_attr(''alarm_control_panel.alarmo'', ''arm_mode'')
              == ''armed_away'' }}'
          then:
          - wait_template: '{{ not is_state(''alarm_control_panel.alarmo'', ''triggered'')
              }}'
            timeout:
              seconds: 60
            continue_on_timeout: true
          - condition: state
            entity_id: alarm_control_panel.alarmo
            state: triggered
          - action: siren.turn_on
            target:
              entity_id: siren.siren
            data:
              volume_level: 1
              duration: 300
            continue_on_error: true
    - conditions:
      - condition: trigger
        id: disarmed
      sequence:
      - action: siren.turn_off
        target:
          entity_id: siren.siren
        continue_on_error: true
      - action: scene.turn_on
        target:
          entity_id: scene.hub_off
      - if:
        - condition: template
          value_template: '{{ states.scene.before_alarm is not none }}'
        then:
        - action: scene.turn_on
          target:
            entity_id: scene.before_alarm
    - conditions:
      - condition: trigger
        id: disarm_button
      sequence:
      - action: alarm_control_panel.alarm_disarm
        target:
          entity_id: alarm_control_panel.alarmo
  mode: parallel
  max: 5
- id: '1789700000002'
  alias: Battery Alerts
  description: Phone alert with the battery type when a sensor drops below 20%, plus
    a Sunday 18:00 roundup of everything still low. Unplugged sensors (unavailable)
    are skipped.
  variables:
    threshold: 20
    batteries:
      sensor.airthings_battery: [Airthings, 3× AAA]
      sensor.shortcut_button_battery: [Shortcut button, CR2032]
      sensor.entryway_remote_battery: [Entryway remote, CR2032]
      sensor.bedroom_remote_battery: [Bedroom remote, 2× AAA]
      sensor.symfonisk_remote_battery: [Symfonisk remote, CR2032]
      sensor.workdesk_button_battery: [Workdesk button, CR2032]
      sensor.hidden_switch_button_battery: [Hidden switch, CR2032]
      sensor.lumi_lumi_sensor_switch_battery: [Aqara button, CR2032]
      sensor.closet_button_battery: [Closet button, CR2032]
      sensor.front_door_sensor_battery: [Front door sensor, CR1632]
      sensor.balcony_door_sensor_battery: [Balcony door sensor, CR1632]
      sensor.bedroom_door_sensor_battery: [Bedroom door sensor, CR1632]
      sensor.electrical_cabinet_sensor_battery: [Electrical cabinet sensor, CR1632]
      sensor.front_door_motion_battery: [Front door motion, CR2450]
      sensor.hallway_motion_battery: [Hallway motion, CR2450]
      sensor.inner_motion_battery: [Inner motion, CR2450]
      sensor.living_room_motion_battery: [Living room motion, CR2450]
      sensor.bedroom_sensor_battery: [Bedroom temperature sensor, CR2032]
      sensor.desk_chair_battery: [Desk chair sensor, CR2032]
      sensor.washing_machine_battery_2: [Washing machine sensor, CR2032]
      sensor.water_leak_sensor_alarm_battery: [Water leak sensor, CR2032 (some versions
          take 2× AAA)]
      sensor.bot_4f21_battery: [SwitchBot 4f21, CR2]
      sensor.bot_b8cb_battery: [SwitchBot b8cb, CR2]
      sensor.keypad_v2_battery_level: [Ring keypad, recharge over USB]
      sensor.bedroom_shade_battery: [Bedroom shade, recharge with the Soma charger]
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.airthings_battery
    - sensor.shortcut_button_battery
    - sensor.entryway_remote_battery
    - sensor.bedroom_remote_battery
    - sensor.symfonisk_remote_battery
    - sensor.workdesk_button_battery
    - sensor.hidden_switch_button_battery
    - sensor.lumi_lumi_sensor_switch_battery
    - sensor.closet_button_battery
    - sensor.front_door_sensor_battery
    - sensor.balcony_door_sensor_battery
    - sensor.bedroom_door_sensor_battery
    - sensor.electrical_cabinet_sensor_battery
    - sensor.front_door_motion_battery
    - sensor.hallway_motion_battery
    - sensor.inner_motion_battery
    - sensor.living_room_motion_battery
    - sensor.bedroom_sensor_battery
    - sensor.desk_chair_battery
    - sensor.washing_machine_battery_2
    - sensor.water_leak_sensor_alarm_battery
    - sensor.bot_4f21_battery
    - sensor.bot_b8cb_battery
    - sensor.keypad_v2_battery_level
    - sensor.bedroom_shade_battery
    below: 20
    id: dropped
  - trigger: time
    at: '18:00:00'
    weekday: sun
    id: weekly
  actions:
  - variables:
      low: >-
        {% set ns = namespace(items=[]) %}
        {% for e, info in batteries.items() if is_number(states(e)) and states(e) | float < threshold %}
          {% set ns.items = ns.items + [info[0] ~ ' (' ~ states(e) | float | round(0) | int ~ '%): ' ~ info[1]] %}
        {% endfor %}
        {{ ns.items }}
  - choose:
    - conditions:
      - condition: trigger
        id: dropped
      sequence:
      - action: notify.mobile_app_zflip7
        data:
          title: Battery low
          message: >-
            {% set info = batteries.get(trigger.entity_id, [trigger.to_state.name, 'check the device']) %}
            {{ info[0] }} is at {{ trigger.to_state.state | float | round(0) | int }}%. It takes {{ info[1] }}.
    - conditions:
      - condition: trigger
        id: weekly
      - condition: template
        value_template: '{{ low | count > 0 }}'
      sequence:
      - action: notify.mobile_app_zflip7
        data:
          title: Batteries to replace
          message: '{{ low | join(''\n'') }}'
          data:
            tag: battery-roundup
  mode: queued
- id: '1789700000003'
  alias: Wake-up Light
  description: Starts 20 minutes before the phone's next alarm (04:00-11:00, when
    home). Bedside lamp fades from a dim warm glow to bright neutral white, then the
    shade opens at alarm time. Turning the lamp off stops the fade.
  triggers:
  - trigger: time
    at:
      entity_id: sensor.zflip7_next_alarm
      offset: -00:20:00
  conditions:
  - condition: state
    entity_id: person.olli
    state: home
  - condition: time
    after: 03:40:00
    before: '10:40:00'
  actions:
  - action: light.turn_on
    target:
      entity_id: light.bedside_lamp
    data:
      brightness_pct: 1
      color_temp_kelvin: 2000
  - repeat:
      while:
      - condition: state
        entity_id: light.bedside_lamp
        state: 'on'
      - condition: template
        value_template: '{{ repeat.index <= 19 }}'
      sequence:
      - delay: 00:01:00
      - if:
        - condition: state
          entity_id: light.bedside_lamp
          state: 'on'
        then:
        - action: light.turn_on
          target:
            entity_id: light.bedside_lamp
          data:
            brightness_pct: '{{ 1 + repeat.index * 4 }}'
            color_temp_kelvin: '{{ 2000 + repeat.index * 80 }}'
  - if:
    - condition: state
      entity_id: light.bedside_lamp
      state: 'on'
    then:
    - action: cover.set_cover_position
      target:
        entity_id: cover.bedroom_shade
      data:
        position: 100
  mode: single
- id: '1789700000004'
  alias: Welcome Home
  description: After being away 10+ minutes, waits for the front door (up to 15 min
    after the phone gets home). Then lights on if the sun is down, and the Sonos resumes
    if Leaving Home paused it less than 4 hours ago (08:00-23:00 only).
  triggers:
  - trigger: state
    entity_id: person.olli
    to: home
    not_from:
    - unknown
    - unavailable
  conditions:
  - condition: template
    value_template: '{{ now() - trigger.from_state.last_changed > timedelta(minutes=10)
      }}'
  actions:
  - variables:
      away: '{{ (now() - trigger.from_state.last_changed).total_seconds() }}'
  - if:
    - condition: template
      value_template: '{{ now() - states.binary_sensor.front_door.last_changed > timedelta(minutes=5)
        }}'
    then:
    - wait_for_trigger:
      - trigger: state
        entity_id: binary_sensor.front_door
        to: 'on'
      timeout: 00:15:00
      continue_on_timeout: true
  - if:
    - condition: state
      entity_id: sun.sun
      state: below_horizon
    - condition: state
      entity_id: input_boolean.lights_are_on
      state: 'off'
    then:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.lights_are_on
    - action: script.turn_on
      target:
        entity_id: script.announce
      data:
        variables:
          message: Olli just got home and it's dark out, so the lights are on.
          priority: low
          room: living_room
  - if:
    - condition: state
      entity_id: input_boolean.sonos_resume
      state: 'on'
    - condition: template
      value_template: '{{ away | float < 4 * 3600 }}'
    - condition: time
      after: 08:00:00
      before: '23:00:00'
    then:
    - action: media_player.media_play
      target:
        entity_id: media_player.sonos
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.sonos_resume
  mode: single
- id: '1789700000005'
  alias: Water Leak Alarm
  description: Loud phone alarm (rings through Do Not Disturb) when the leak sensor
    gets wet, repeated every 5 minutes while it stays wet. A follow-up when it's dry
    again.
  triggers:
  - trigger: state
    entity_id: binary_sensor.water_leak_sensor_alarm_moisture
    from: 'off'
    to: 'on'
    id: wet
  - trigger: state
    entity_id: binary_sensor.water_leak_sensor_alarm_moisture
    from: 'on'
    to: 'off'
    id: dry
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: wet
      sequence:
      - repeat:
          while:
          - condition: state
            entity_id: binary_sensor.water_leak_sensor_alarm_moisture
            state: 'on'
          - condition: template
            value_template: '{{ repeat.index <= 12 }}'
          sequence:
          - action: notify.mobile_app_zflip7
            data:
              title: Water leak!
              message: The leak sensor is wet. Check it now.
              data:
                tag: water-leak
                ttl: 0
                priority: high
                channel: alarm_stream
          - action: script.turn_on
            target:
              entity_id: script.announce
            data:
              variables:
                message: Water leak! The leak sensor is wet. Check it now.
                priority: urgent
          - delay: 00:05:00
    - conditions:
      - condition: trigger
        id: dry
      sequence:
      - action: notify.mobile_app_zflip7
        data:
          title: Leak sensor dry
          message: The leak sensor is dry again.
          data:
            tag: water-leak
      - action: script.turn_on
        target:
          entity_id: script.announce
        data:
          variables:
            message: The water leak sensor is dry again.
            priority: normal
  mode: restart
- id: '1789700000006'
  alias: Bedtime
  description: Getting into bed or closing the bedroom door between 22:30 and 04:00
    (while home, once a night). The bedside lamp comes on warm and dim, everything
    else goes off, the Sonos pauses, the shade closes, and the wall tablet screen
    goes off.
  triggers:
  - trigger: state
    entity_id: binary_sensor.in_bed
    to: 'on'
  - trigger: state
    entity_id: binary_sensor.bedroom_door
    from: 'on'
    to: 'off'
  conditions:
  - condition: state
    entity_id: person.olli
    state: home
  - condition: time
    after: '22:30:00'
    before: 04:00:00
  - condition: template
    value_template: '{{ this.attributes.last_triggered is none or now() - this.attributes.last_triggered
      > timedelta(hours=8) }}'
  actions:
  - action: light.turn_on
    target:
      entity_id: light.bedside_lamp
    data:
      brightness_pct: 25
      color_temp_kelvin: 2200
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.lights_are_on
  - if:
    - condition: state
      entity_id: media_player.sonos
      state: playing
    then:
    - action: media_player.media_pause
      target:
        entity_id: media_player.sonos
  - action: cover.set_cover_position
    target:
      entity_id: cover.bedroom_shade
    data:
      position: 0
  - action: light.turn_off
    target:
      entity_id: light.wall_screen
  mode: single
- id: '1789700000007'
  alias: Vacuum Messages
  description: Phone message when the Roborock finishes a clean (area and time), or
    when it gets stuck.
  triggers:
  - trigger: state
    entity_id: vacuum.roborock_s6
    from: returning
    to: docked
    id: done
  - trigger: state
    entity_id: vacuum.roborock_s6
    to: error
    id: stuck
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: done
      sequence:
      - action: notify.mobile_app_zflip7
        data:
          title: Vacuuming done
          message: Cleaned {{ states('sensor.roborock_s6_cleaning_area') }} m² in {{
            states('sensor.roborock_s6_cleaning_time') | float(0) | round(0) | int }}
            minutes.
          data:
            tag: vacuum
      - action: script.turn_on
        target:
          entity_id: script.announce
        data:
          variables:
            message: The robot vacuum finished cleaning.
            details: Cleaned {{ states('sensor.roborock_s6_cleaning_area') }} square meters in {{ states('sensor.roborock_s6_cleaning_time') | float(0) | round(0) | int }} minutes.
            priority: low
    - conditions:
      - condition: trigger
        id: stuck
      sequence:
      - action: notify.mobile_app_zflip7
        data:
          title: Vacuum stuck
          message: 'The Roborock needs help: {{ states(''sensor.roborock_s6_vacuum_error'')
            | replace(''_'', '' '') }}.'
          data:
            tag: vacuum
      - action: script.turn_on
        target:
          entity_id: script.announce
        data:
          variables:
            message: The robot vacuum is stuck and needs help.
            details: 'Error: {{ states(''sensor.roborock_s6_vacuum_error'') | replace(''_'', '' '') }}.'
            priority: normal
  mode: single
- id: '1789700000008'
  alias: Wall Tablet Screen
  description: Screen off after 5 minutes away and at 01:00. On at 07:00 when home,
    when arriving home, or on entryway or living room motion between 06:00 and 22:30.
    Bedtime also turns it off.
  triggers:
  - trigger: state
    entity_id: person.olli
    from: home
    for:
      minutes: 5
    id: 'off'
  - trigger: time
    at: 01:00:00
    id: 'off'
  - trigger: state
    entity_id: person.olli
    to: home
    id: 'on'
  - trigger: time
    at: 07:00:00
    id: morning
  - trigger: state
    entity_id:
    - binary_sensor.front_door_motion
    - binary_sensor.hallway_motion
    - binary_sensor.living_room_motion
    to: 'on'
    id: motion
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: 'off'
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.wall_screen
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id: 'on'
        - condition: and
          conditions:
          - condition: trigger
            id: morning
          - condition: state
            entity_id: person.olli
            state: home
        - condition: and
          conditions:
          - condition: trigger
            id: motion
          - condition: time
            after: 06:00:00
            before: '22:30:00'
          - condition: state
            entity_id: person.olli
            state: home
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.wall_screen
  mode: queued
- id: '1789700000009'
  alias: Air It Out
  description: When the Airthings VOC level stays above 1000 ppb for 15 minutes (08:00-22:00,
    home, balcony door shut), a nudge to air out. From November to March, a reminder
    to close the balcony door after 10 minutes. At most once every 3 hours.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.airthings_voc
    above: 1000
    for:
      minutes: 15
  conditions:
  - condition: state
    entity_id: person.olli
    state: home
  - condition: state
    entity_id: binary_sensor.balcony_door
    state: 'off'
  - condition: time
    after: 08:00:00
    before: '22:00:00'
  - condition: template
    value_template: '{{ this.attributes.last_triggered is none or now() - this.attributes.last_triggered
      > timedelta(hours=3) }}'
  actions:
  - action: notify.mobile_app_zflip7
    data:
      title: Stale air
      message: VOCs are at {{ states('sensor.airthings_voc') | int(0) }} ppb. Open
        the balcony door for a bit?
      data:
        tag: air-out
  - action: script.turn_on
    target:
      entity_id: script.announce
    data:
      variables:
        message: The air is getting stale; suggest opening the balcony door for a bit.
        details: VOC level is {{ states('sensor.airthings_voc') | int(0) }} ppb.
        priority: low
        room: living_room
  - if:
    - condition: template
      value_template: '{{ now().month in [11, 12, 1, 2, 3] }}'
    then:
    - wait_for_trigger:
      - trigger: state
        entity_id: binary_sensor.balcony_door
        to: 'on'
      timeout: 00:30:00
      continue_on_timeout: false
    - wait_for_trigger:
      - trigger: state
        entity_id: binary_sensor.balcony_door
        to: 'off'
      timeout: 00:10:00
    - if:
      - condition: state
        entity_id: binary_sensor.balcony_door
        state: 'on'
      then:
      - action: notify.mobile_app_zflip7
        data:
          title: Balcony door
          message: It's been 10 minutes. Time to close the balcony door.
          data:
            tag: air-out
      - action: script.turn_on
        target:
          entity_id: script.announce
        data:
          variables:
            message: The balcony door has been open for 10 minutes; time to close it.
            priority: low
  mode: single
- id: '1789700000010'
  alias: Door Left Open at Night
  description: At 23:30, a phone message if the front or balcony door is still open.
  triggers:
  - trigger: time
    at: '23:30:00'
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: binary_sensor.front_door
      state: 'on'
    - condition: state
      entity_id: binary_sensor.balcony_door
      state: 'on'
  actions:
  - action: notify.mobile_app_zflip7
    data:
      title: Door open
      message: >-
        {% set d = [
          'front door' if is_state('binary_sensor.front_door', 'on') else '',
          'balcony door' if is_state('binary_sensor.balcony_door', 'on') else ''
        ] | select | list %}
        {{ (d | join(' and ')) | capitalize }} {{ 'are' if d | count > 1 else 'is' }} still open.
  - action: script.turn_on
    target:
      entity_id: script.announce
    data:
      variables:
        message: >-
          {{ ['The front door' if is_state('binary_sensor.front_door', 'on') else '',
              'the balcony door' if is_state('binary_sensor.balcony_door', 'on') else '']
             | select | join(' and ') | capitalize }} still open at bedtime.
        priority: normal
        ignore_quiet_hours: true
  mode: single
- id: '1789700000011'
  alias: Cleaning Chores
  description: Adds chores to the Cleaning list when they're due (10:00 daily) and
    sends one phone message listing what was added. Scheduled chores reopen if they
    were ticked off. Maintenance chores (Roborock, AC filter) are added while the
    device says it's due, and cleared once it's reset. "Change bedsheets" is added
    when the bedsheet timer runs out.
  variables:
    scheduled:
    - name: Bathroom
      weekday: 5
    - name: Kitchen
      weekday: 2
    - name: Sauna
      days: [1]
    - name: Fridge
      days: [1]
    - name: Dust the shelves
      days: [1, 15]
    maintenance:
    - name: Clean the Roborock sensors
      due: '{{ states(''sensor.roborock_s6_sensor_time_left'') | float(1) <= 0 }}'
    - name: Clean the Roborock filter
      due: '{{ states(''sensor.roborock_s6_filter_time_left'') | float(1) <= 0 }}'
    - name: Clean the Roborock main brush
      due: '{{ states(''sensor.roborock_s6_main_brush_time_left'') | float(1) <= 0 }}'
    - name: Clean the Roborock side brush
      due: '{{ states(''sensor.roborock_s6_side_brush_time_left'') | float(1) <= 0 }}'
    - name: Clean the AC filter
      due: '{{ is_state(''binary_sensor.living_room_ac_filter_clean_required'', ''on'')
        and now().month in [5, 6, 7, 8, 9] }}'
  triggers:
  - trigger: time
    at: '10:00:00'
    id: daily
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.bedsheets_helper
    id: bedsheets
  actions:
  - action: todo.get_items
    target:
      entity_id: todo.cleaning
    data:
      status:
      - needs_action
      - completed
    response_variable: lst
  - variables:
      items: '{{ lst[''todo.cleaning''][''items''] }}'
      open: '{{ items | selectattr(''status'', ''eq'', ''needs_action'') | map(attribute=''summary'')
        | list }}'
      done: '{{ items | selectattr(''status'', ''eq'', ''completed'') | map(attribute=''summary'')
        | list }}'
      due_now: >-
        {% if trigger.id == 'bedsheets' %}
          {{ ['Change bedsheets'] }}
        {% else %}
          {% set ns = namespace(d=[]) %}
          {% for c in scheduled %}
            {% if (c.weekday is defined and now().weekday() == c.weekday)
               or (c.days is defined and now().day in c.days) %}
              {% set ns.d = ns.d + [c.name] %}
            {% endif %}
          {% endfor %}
          {{ ns.d }}
        {% endif %}
      maint_due: >-
        {% if trigger.id == 'daily' %}
          {{ maintenance | selectattr('due') | map(attribute='name') | list }}
        {% else %}[]{% endif %}
      maint_reset: >-
        {% if trigger.id == 'daily' %}
          {{ maintenance | rejectattr('due') | map(attribute='name') | select('in', done) | list }}
        {% else %}[]{% endif %}
      to_add: '{{ (due_now | reject(''in'', open) | reject(''in'', done) | list) + (maint_due
        | reject(''in'', open) | reject(''in'', done) | list) }}'
      to_reopen: '{{ due_now | select(''in'', done) | list }}'
  - repeat:
      for_each: '{{ to_add }}'
      sequence:
      - action: todo.add_item
        target:
          entity_id: todo.cleaning
        data:
          item: '{{ repeat.item }}'
          due_date: '{{ now().date() }}'
  - repeat:
      for_each: '{{ to_reopen }}'
      sequence:
      - action: todo.update_item
        target:
          entity_id: todo.cleaning
        data:
          item: '{{ repeat.item }}'
          status: needs_action
          due_date: '{{ now().date() }}'
  - repeat:
      for_each: '{{ maint_reset }}'
      sequence:
      - action: todo.remove_item
        target:
          entity_id: todo.cleaning
        data:
          item: '{{ repeat.item }}'
  - if:
    - condition: template
      value_template: '{{ (to_add + to_reopen) | count > 0 }}'
    then:
    - action: notify.mobile_app_zflip7
      data:
        title: Cleaning
        message: 'Added to the list: {{ (to_add + to_reopen) | join('', '') }}.'
        data:
          tag: cleaning
  mode: queued
- id: '1789700000012'
  alias: Weekly Health Check
  description: Sundays at 18:05, one phone message with available updates and entities
    that went unavailable during the week (ignoring the minutes right after a restart).
    Low batteries come in the Battery Alerts roundup at 18:00.
  triggers:
  - trigger: time
    at: '18:05:00'
    weekday: sun
  actions:
  - variables:
      updates: '{{ states.update | selectattr(''state'', ''eq'', ''on'') | map(attribute=''name'')
        | list }}'
      started: '{{ as_datetime(states(''sensor.uptime''), now() - timedelta(days=30))
        }}'
      offline: >-
        {% set ns = namespace(e=[]) %}
        {% for s in states
           if s.domain in ['light', 'switch', 'binary_sensor', 'sensor', 'media_player', 'climate', 'cover', 'fan', 'vacuum']
           and s.state == 'unavailable'
           and s.last_changed > now() - timedelta(days=7)
           and s.last_changed > as_datetime(started) + timedelta(minutes=15) %}
          {% set ns.e = ns.e + [s.name] %}
        {% endfor %}
        {{ ns.e }}
  - action: notify.mobile_app_zflip7
    data:
      title: Weekly HA check
      message: >-
        {% if updates | count == 0 and offline | count == 0 %}All good: no updates waiting and nothing went offline this week.
        {%- else -%}
        {%- if updates | count > 0 %}Updates ({{ updates | count }}): {{ updates | join(', ') }}.{% endif %}
        {%- if offline | count > 0 %} Went offline ({{ offline | count }}): {{ offline[:10] | join(', ') }}{{ ' and more' if offline | count > 10 }}.{% endif %}
        {%- endif %}
      data:
        tag: health-check
  mode: single
- id: '1789700000013'
  alias: Back Up UI Edits
  description: At 04:00, commits automations, scripts and scenes edited in the HA
    UI and pushes them to GitHub. Phone message only when something was pushed or
    it failed.
  triggers:
  - trigger: time
    at: 04:00:00
  actions:
  - action: shell_command.backup_ui_edits
    response_variable: result
  - if:
    - condition: template
      value_template: '{{ result.returncode != 0 or ''Backed up'' in result.stdout }}'
    then:
    - action: notify.mobile_app_zflip7
      data:
        title: '{{ ''UI edits backed up'' if result.returncode == 0 else ''UI backup failed''
          }}'
        message: '{{ (result.stdout ~ '' '' ~ result.stderr) | trim | truncate(250) }}'
        data:
          tag: ui-backup
  mode: single
- id: '1789700000014'
  alias: Mold Risk
  description: Phone message when the Airthings mold risk index (0-10) stays at 5
    or above for 6 hours. At most once a day.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.airthings_mold
    above: 4.9
    for:
      hours: 6
  conditions:
  - condition: template
    value_template: '{{ this.attributes.last_triggered is none or now() - this.attributes.last_triggered
      > timedelta(hours=24) }}'
  actions:
  - action: notify.mobile_app_zflip7
    data:
      title: Mold risk
      message: The Airthings mold risk is {{ states('sensor.airthings_mold') }} (out
        of 10). Air out, keep humidity down, and check window corners for condensation.
      data:
        tag: mold
  mode: single
- id: '1789700000015'
  alias: Bedside Outlet
  description: A short press on the Aqara button (ButtonAqara) toggles the second
    bedside lamp (switch.bedside_outlet).
  triggers:
  - trigger: device
    device_id: e96474aad99d420b04e16820f046de66
    domain: zha
    type: remote_button_short_press
    subtype: remote_button_short_press
  actions:
  - action: switch.toggle
    target:
      entity_id: switch.bedside_outlet
  mode: single
- id: '1789700000016'
  alias: Good Morning
  description: At the phone's alarm time (04:00-11:00, when home), the Echo in the
    bedroom says good morning with today's weather and the first calendar event.
  triggers:
  - trigger: time
    at:
      entity_id: sensor.zflip7_next_alarm
  conditions:
  - condition: state
    entity_id: person.olli
    state: home
  - condition: time
    after: 04:00:00
    before: '11:00:00'
  actions:
  - action: weather.get_forecasts
    continue_on_error: true
    target:
      entity_id: weather.forecast_home
    data:
      type: daily
    response_variable: fc
  - action: calendar.get_events
    continue_on_error: true
    target:
      entity_id: calendar.salonen_olli_gmail_com
    data:
      start_date_time: '{{ now() }}'
      end_date_time: '{{ today_at(''23:59'') }}'
    response_variable: cal
  - variables:
      today: '{{ fc[''weather.forecast_home''].forecast[0] if fc is defined and fc[''weather.forecast_home'']
        is defined else none }}'
      first_event: '{{ (cal[''calendar.salonen_olli_gmail_com''].events | sort(attribute=''start''))[0]
        if cal is defined and cal[''calendar.salonen_olli_gmail_com''] is defined
        and cal[''calendar.salonen_olli_gmail_com''].events | count > 0 else none
        }}'
  - action: script.turn_on
    target:
      entity_id: script.announce
    data:
      variables:
        message: Good morning, time to get up.
        details: >-
          {% if today %}Today: {{ today.condition | replace('partlycloudy', 'partly cloudy') | replace('-', ' ') }}, high
          {{ today.temperature | round(0) | int }} °C, low {{ today.templow | round(0) | int }} °C
          {%- if today.precipitation | default(0) > 0 %}, {{ today.precipitation }} mm of rain or snow{% endif %}.{% endif %}
          {% if first_event %}First on the calendar: {{ first_event.summary }}
          {%- if 'T' in first_event.start %} at {{ as_datetime(first_event.start).strftime('%H:%M') }}{% endif %}.
          {% else %}Nothing on the calendar today.{% endif %}
          Mention the weather and the calendar item; it may be two sentences.
        priority: normal
        room: bedroom
        ignore_quiet_hours: true
  mode: single
