- id: '1745341646158'
  alias: System Status
  description: Shows warnings (leak, hot bedroom, alarm, bedsheets, low batteries)
    on the dashboard until dismissed.
  triggers:
  - trigger: state
    entity_id: binary_sensor.water_leak_sensor_alarm_moisture
    from: 'off'
    to: 'on'
    id: water_leak
  - trigger: numeric_state
    entity_id: sensor.bedroom_temperature
    above: 25
    id: bedroom_too_hot
  - trigger: state
    entity_id: alarm_control_panel.alarmo
    to: triggered
    id: alarm_triggered
  - trigger: state
    entity_id: timer.bedsheets_helper
    from: active
    to: idle
    id: linen_change_due
  - trigger: event
    event_type: low_battery
    id: low_battery
  - trigger: state
    entity_id: input_boolean.systemstatusindicators
    from: 'on'
    to: 'off'
    id: dismissed
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: dismissed
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.systemstatusnumber
        data:
          value: 0
      - action: input_text.set_value
        target:
          entity_id: input_text.systemstatushelper
        data:
          value: Nothing currently needs your attention.
    default:
    - variables:
        message: "{{ {\n  'water_leak': 'Water leak detected.',\n  'bedroom_too_hot':\
          \ 'Bedroom is too hot.',\n  'alarm_triggered': 'Alarm was triggered at home.',\n\
          \  'linen_change_due': 'Bedsheets due for change.',\n  'low_battery': 'Following\
          \ batteries are low: ' ~ (trigger.event.data.sensors | default('') if trigger.platform\
          \ == 'event' else '')\n}[trigger.id] | truncate(100, true, '') }}"
    - action: input_text.set_value
      target:
        entity_id:
        - input_text.info_helper
        - input_text.systemstatushelper
      data:
        value: '{{ message }}'
    - action: input_number.set_value
      target:
        entity_id: input_number.systemstatusnumber
      data:
        value: 1
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.systemstatusindicators
  mode: queued
- id: '1746741253623'
  alias: Low battery level detection & notification for all battery sensors
  description: Daily check; sends the low_battery event that System Status shows.
