  - condition: template
    value_template: "{{ this.attributes.last_triggered is none\n   or (now() - this.attributes.last_triggered).total_seconds()
      > 0.5 }}"
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.command == ''toggle'' }}'
      sequence:
      - action: input_boolean.toggle
        target:
          entity_id: input_boolean.lights_are_on
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.command == ''press'' and trigger.event.data.params.param1
          == 257 }}'
      - condition: state
        entity_id: input_boolean.lights_are_on
        state: 'on'
      sequence:
      - action: script.cycle_lights_scene
        data:
          step: 1
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.command == ''press'' and trigger.event.data.params.param1
          == 256 }}'
      - condition: state
        entity_id: input_boolean.lights_are_on
        state: 'on'
      sequence:
      - action: script.cycle_lights_scene
        data:
          step: -1
  mode: queued
  max: 4
