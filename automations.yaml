- id: '1662810620782'
  alias: Desk Monitors
  description: Workdesk button toggles the monitors. Sitting on the chair turns them
    on, 10 minutes without movement turns them off.
  triggers:
  - trigger: device
    device_id: f165f2aaaf37fd2d78ac6fba9c858659
    domain: zha
    type: remote_button_short_press
    subtype: remote_button_short_press
    id: button
  - trigger: state
    entity_id: binary_sensor.vibration_multivitamins_iaszone
    from: 'off'
    to: 'on'
    id: sat_down
  - trigger: state
    entity_id: binary_sensor.vibration_multivitamins_iaszone
    to: 'off'
    for:
      minutes: 10
    id: left_desk
  variables:
    monitors_on: '{{ is_state(''switch.smart_usb_extension_switch'', ''on'') }}'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''button'' and monitors_on or trigger.id
          == ''left_desk'' and monitors_on }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id:
          - switch.smart_usb_extension_switch
          - switch.smart_usb_extension_switch_2
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''button'', ''sat_down''] and not monitors_on
          }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id:
          - switch.smart_usb_extension_switch_2
          - switch.smart_usb_extension_switch
  mode: single
