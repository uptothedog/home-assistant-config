- id: '1789591482844'
  alias: N2 Remote
  description: ''
  triggers:
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: 2b814477916889e328a043a0199f1ad7
  conditions:
  - condition: template
    value_template: '{{ trigger.event.data.command in [''on'', ''press'', ''move'']
      }}'
  - condition: template
    value_template: "{{ this.attributes.last_triggered is none\n   or (now() - this.attributes.last_triggered).total_seconds()
      > 0.7 }}"
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.command == ''on'' }}'
      sequence:
      - action: light.toggle
        target:
          entity_id: light.bedroom_ceiling
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.command == ''press'' and trigger.event.data.args[0]
          == 256 }}'
      sequence:
      - action: light.toggle
        target:
          entity_id: light.mibedsidelamp2_4dc6
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.command == ''press'' and trigger.event.data.args[0]
          == 257 }}'
      sequence:
      - action: switch.toggle
        target:
          entity_id: switch.ikea_of_sweden_tradfri_control_outlet_switch
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.command == ''move'' and ''Down'' in
          (trigger.event.data.args[0] | string) }}'
      sequence:
      - action: script.apply_lights
        data:
          scene: scene.all_off
      - action: light.turn_on
        target:
          entity_id: light.mibedsidelamp2_4dc6
        data:
          brightness_pct: 100
  mode: queued
  max: 4
- id: '1789592215369'
  alias: Balcony Lights
  description: 'Winter schedule (Nov 15 to Feb 1): on at 19:00, off at 22:30. All
    year: on when the balcony door opens 21:00 to 05:00, off when it closes (unless
    the winter schedule is running).'
  triggers:
  - trigger: time
    at: '19:00:00'
    id: schedule_on
  - trigger: time
    at: '22:30:00'
    id: schedule_off
  - trigger: state
    entity_id: binary_sensor.lumi_lumi_sensor_magnet_opening_3
    to: 'on'
    id: opened
  - trigger: state
    entity_id: binary_sensor.lumi_lumi_sensor_magnet_opening_3
    from: 'on'
    to: 'off'
    id: closed
  variables:
    winter_season: '{% set md = now().month * 100 + now().day %}{{ md >= 1115 or
      md <= 201 }}'
    in_schedule: '{{ winter_season and today_at(''19:00'') <= now() < today_at(''22:30'')
      }}'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: schedule_on
      - condition: template
        value_template: '{{ winter_season }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.outdoor_outlet
    - conditions:
      - condition: trigger
        id: schedule_off
      - condition: state
        entity_id: binary_sensor.lumi_lumi_sensor_magnet_opening_3
        state: 'off'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.outdoor_outlet
    - conditions:
      - condition: trigger
        id: opened
      - condition: time
        after: '21:00:00'
        before: '05:00:00'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.outdoor_outlet
    - conditions:
      - condition: trigger
        id: closed
      - condition: template
        value_template: '{{ not in_schedule }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.outdoor_outlet
  mode: single
- id: '1789593063851'
