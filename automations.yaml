- id: '1662810620782'
  alias: Desk Monitors
  description: Workdesk button toggles the monitors. Sitting on the chair turns them
    on, 10 minutes without movement turns them off.
  triggers:
  - trigger: device
    device_id: f165f2aaaf37fd2d78ac6fba9c858659
    domain: zha
    type: remote_button_short_press
    subtype: remote_button_short_press
    id: button
  - trigger: state
    entity_id: binary_sensor.desk_chair
    from: 'off'
    to: 'on'
    id: sat_down
  - trigger: state
    entity_id: binary_sensor.desk_chair
    to: 'off'
    for:
      minutes: 10
    id: left_desk
  variables:
    monitors_on: '{{ is_state(''switch.desk_monitors'', ''on'') }}'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''button'' and monitors_on or trigger.id
          == ''left_desk'' and monitors_on }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id:
          - switch.desk_monitors
          - switch.desk_lights
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''button'', ''sat_down''] and not monitors_on
          }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id:
          - switch.desk_lights
          - switch.desk_monitors
  mode: single
- id: '1663155469637'
  alias: Ring Keypad Automations
