- id: '1618697356624'
  alias: AU BRIEF Off Bed
  description: ''
  trigger:
  - platform: webhook
    webhook_id: out_of_bed
    allowed_methods:
    - POST
    - PUT
    local_only: false
  condition:
  - condition: state
    entity_id: input_boolean.got_up
    state: 'off'
  action:
  - service: automation.trigger
    data: {}
    target:
      entity_id: automation.au_lights_daytime
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.got_up
    data: {}
  - if:
    - type: is_open
      condition: device
      device_id: cf42bb9a1afad96b6fe40d4aee94aec7
      entity_id: binary_sensor.lumi_lumi_sensor_magnet_opening_4
      domain: binary_sensor
    then:
    - service: tts.cloud_say
      data:
        entity_id: media_player.entryway_speaker
        message: '{{ ["Good morning.", "Good morning Olli.", "Good morning, I hope
          you will have a great day. Anyway,", "Hey there Olli, Here''s the weather
          for you,"] | random }} "This morning it is {{ states(''weather.weatherviikki'')
          }} , outside temperature is {{ state_attr(''weather.weatherviikki'', ''temperature'')
          }} degrees, humidity stands at {{ state_attr(''weather.weatherviikki'',
          ''humidity'') }} percent.'
    else:
    - service: tts.cloud_say
      data:
        entity_id: media_player.living_room_display
        message: '{{ ["Good morning.", "Good morning Olli.", "Good morning, I hope
          you will have a great day. Anyway,", "Hey there Olli, Here''s the weather
          for you,"] | random }} "This morning it is {{ states(''weather.home'') }}
          , outside temperature is {{ state_attr(''weather.home'', ''temperature'')
          }} degrees, humidity stands at {{ state_attr(''weather.home'', ''humidity'')
          }} percent.'
  mode: single
- id: '1619549911680'
  alias: Disable
  description: ''
  trigger:
  - platform: state
    entity_id: input_boolean.alarm_triggered
    from: 'on'
    to: 'off'
  - platform: state
    entity_id:
    - alarm_control_panel.alarmo
    to: disarmed
  condition:
  - condition: state
    entity_id: input_boolean.alarm
    state: 'on'
  action:
  - service: timer.pause
    target:
      entity_id: timer.alarm_grace_period
    data: {}
  - service: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.alarm
      - input_boolean.alarm_triggered
      - input_boolean.hard_alarm
    data: {}
  - if:
    - condition: state
      entity_id: alarm_control_panel.alarmo
      state: armed_away
    then:
    - service: alarmo.disarm
      data:
        entity_id: alarm_control_panel.alarmo
  - service: tts.cloud_say
    data:
      entity_id: media_player.entryway_speaker
      message: Alarm disabled.
      cache: true
  - scene: scene.hub_done
  - delay:
      hours: 0
      minutes: 0
      seconds: 5
      milliseconds: 0
  - scene: scene.hub_off
  mode: single
- id: '1619552120238'
  alias: Trigger Actions
  description: ''
  trigger:
  - platform: state
    entity_id: input_boolean.alarm_triggered
    from: 'off'
    to: 'on'
  condition: []
  action:
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.alarm
    data: {}
  - service: notify.nona
    data:
      message: 'The home alarm has been tripped. Check the front door camera and inform
        the police as necessary. Address: Von Daehnin katu 21 C 34'
  - service: tts.cloud_say
    data:
      entity_id: media_player.entryway_speaker
      message: Tenant is being informed of an intruder. The police are being called.
      cache: true
  - delay:
      hours: 0
      minutes: 0
      seconds: 6
      milliseconds: 0
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.alarm_triggered
        state: 'on'
      sequence:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.hard_alarm
        data: {}
    default:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.hard_alarm
      data: {}
  mode: single
- id: '1619977387291'
  alias: Light
  description: ''
  trigger:
  - platform: state
    entity_id: input_boolean.alarm_triggered
    from: 'off'
    to: 'on'
  condition: []
  action:
  - repeat:
      while:
      - condition: state
        entity_id: input_boolean.alarm_triggered
        state: 'on'
      sequence:
      - scene: scene.alarm
      - delay:
          hours: 0
          minutes: 0
          seconds: 1
          milliseconds: 0
      - service: scene.turn_on
        target:
          entity_id: scene.all_off
        metadata: {}
      - delay:
          hours: 0
          minutes: 0
          seconds: 1
          milliseconds: 0
  mode: single
