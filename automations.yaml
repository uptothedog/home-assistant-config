- id: '1789592215369'
  alias: Balcony Lights
  description: 'Winter schedule (Nov 15 to Feb 1): on at 19:00, off at 22:30. All
    year: on when the balcony door opens 21:00 to 05:00, off when it closes (unless
    the winter schedule is running).'
  triggers:
  - trigger: time
    at: '19:00:00'
    id: schedule_on
  - trigger: time
    at: '22:30:00'
    id: schedule_off
  - trigger: state
    entity_id: binary_sensor.balcony_door
    to: 'on'
    id: opened
  - trigger: state
    entity_id: binary_sensor.balcony_door
    from: 'on'
    to: 'off'
    id: closed
  variables:
    winter_season: '{% set md = now().month * 100 + now().day %}{{ md >= 1115 or
      md <= 201 }}'
    in_schedule: '{{ winter_season and today_at(''19:00'') <= now() < today_at(''22:30'')
      }}'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: schedule_on
      - condition: template
        value_template: '{{ winter_season }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.outdoor_outlet
    - conditions:
      - condition: trigger
        id: schedule_off
      - condition: state
        entity_id: binary_sensor.balcony_door
        state: 'off'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.outdoor_outlet
    - conditions:
      - condition: trigger
        id: opened
      - condition: time
        after: '21:00:00'
        before: '05:00:00'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.outdoor_outlet
    - conditions:
      - condition: trigger
        id: closed
      - condition: template
        value_template: '{{ not in_schedule }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.outdoor_outlet
  mode: single
- id: '1789593063851'
  alias: Bedroom
  description: 'Bedroom door: lights on when leaving in the morning, fan on when the
    door closes at night and off when it opens in the morning. (Lights off at bedtime
    is in Bedtime.)'
  triggers:
  - trigger: state
    entity_id: binary_sensor.bedroom_door
    from: 'off'
    to: 'on'
    id: door_open
  - trigger: state
    entity_id: binary_sensor.bedroom_door
    from: 'on'
    to: 'off'
    id: door_closed
  actions:
  - if:
    - condition: trigger
      id: door_open
    - condition: time
      after: 07:00:00
      before: '12:00:00'
    then:
    - action: fan.turn_off
      target:
        entity_id: fan.bedroom_fan
  - if:
    - condition: trigger
      id: door_open
    - condition: time
      after: 08:00:00
      before: '12:00:00'
    - condition: state
      entity_id: input_boolean.lights_are_on
      state: 'off'
    then:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.lights_are_on
  - if:
    - condition: trigger
      id: door_closed
    - condition: time
      after: '22:00:00'
      before: 04:00:00
    then:
    - action: fan.turn_on
      target:
        entity_id: fan.bedroom_fan
  mode: single
- id: '1789593353880'
  alias: Living Room Remote
  description: ''
  triggers:
  - trigger: event
    event_type: zha_event
    event_data:
      device_ieee: 90:fd:9f:ff:fe:de:29:e2
  conditions:
  - condition: template
    value_template: '{{ trigger.event.data.command in [''toggle'', ''press''] }}'
  - condition: template
