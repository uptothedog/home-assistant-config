- id: '1634049171320'
  alias: Leaving Home
  description: Stop the Sonos when leaving, vacuum after 10 min away (once a day),
    lights off after 15 min away. Resets the vacuum flag at 07:00.
  triggers:
  - trigger: state
    entity_id: person.olli
    from: home
    id: left
  - trigger: state
    entity_id: person.olli
    from: home
    to: not_home
    for:
      minutes: 10
    id: vacuum
  - trigger: state
    entity_id: person.olli
    from: home
    to: not_home
    for:
      minutes: 15
    id: lights
  - trigger: time
    at: 07:00:00
    id: reset
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: left
      - condition: state
        entity_id: media_player.sonos
        state: playing
      sequence:
      - action: media_player.media_stop
        target:
          entity_id: media_player.sonos
    - conditions:
      - condition: trigger
        id: vacuum
      - condition: state
        entity_id: input_boolean.vacuumed_today_2
        state: 'off'
      sequence:
      - action: vacuum.start
        target:
          entity_id: vacuum.roborock_s6
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.vacuumed_today_2
    - conditions:
      - condition: trigger
        id: lights
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id:
          - input_boolean.lights_are_on
          - input_boolean.movie_mode_on
      - action: script.apply_lights
        data:
          scene: scene.all_off
    - conditions:
      - condition: trigger
        id: reset
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.vacuumed_today_2
  mode: queued
