      - condition: state
        entity_id: input_boolean.lights_are_on
        state: 'on'
      sequence:
      - action: script.cycle_lights_scene
        data:
          step: 1
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.command == ''press'' and trigger.event.data.params.param1
          == 256 }}'
      - condition: state
        entity_id: input_boolean.lights_are_on
        state: 'on'
      sequence:
      - action: script.cycle_lights_scene
        data:
          step: -1
