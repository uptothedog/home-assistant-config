- id: '1789584619459'
  alias: Entryway Motion
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.front_door_motion
    - binary_sensor.hallway_motion
    to: 'on'
    id: motion
  - trigger: state
    entity_id:
    - binary_sensor.front_door_motion
    - binary_sensor.hallway_motion
    to: 'off'
    for:
      minutes: 2
    id: clear
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: motion
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.front_door_light
    - conditions:
      - condition: trigger
        id: clear
      - condition: template
        value_template: "{{ states('binary_sensor.front_door_motion') != 'on'\n   and
          states('binary_sensor.hallway_motion') != 'on' }}"
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.front_door_light
  mode: restart
- id: '1789591482844'
  alias: N2 Remote
  description: ''
  triggers:
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: 2b814477916889e328a043a0199f1ad7
  conditions:
  - condition: template
    value_template: '{{ trigger.event.data.command in [''on'', ''press'', ''move'']
      }}'
  - condition: template
    value_template: "{{ this.attributes.last_triggered is none\n   or (now() - this.attributes.last_triggered).total_seconds()
      > 0.7 }}"
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.command == ''on'' }}'
      sequence:
      - action: light.toggle
        target:
          entity_id: light.bedroom_ceiling
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.command == ''press'' and trigger.event.data.args[0]
          == 256 }}'
      sequence:
      - action: light.toggle
        target:
          entity_id: light.bedside_lamp
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.command == ''press'' and trigger.event.data.args[0]
          == 257 }}'
      sequence:
      - action: switch.toggle
        target:
          entity_id: switch.rope_light
    - conditions:
