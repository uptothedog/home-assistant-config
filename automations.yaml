- id: '1620653440877'
  alias: Humidity Drops Below 30
  description: Phone nudge when the air has been dry (below 30%) for a whole day.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.airthings_humidity
    below: 30
    for:
      hours: 24
  actions:
  - action: notify.mobile_app_zflip7
    data:
      title: Dry air
      message: '{% set h = states(''sensor.airthings_humidity'') %}{{ ["Hey Olli,
        humidity levels at home are on the dry side at " ~ h ~ "%. It would be best
        to try and maintain air humidity above 30 percent.", "Air''s a bit dry at
        home - air humidity percentage at home is currently " ~ h ~ "%. It''s more
        healthy for you to keep it above 30 percent."] | random }}'
  mode: single
- id: '1620771818218'
  alias: AC
  description: 'Portable AC (summer only, harmless otherwise): on above 25.9 °C while
    home, off below 24.5 °C. Off after 15 minutes away. Back on when arriving home,
    or when Android Auto connects while away, if it''s above 25.9 °C.'
  triggers:
  - trigger: numeric_state
    entity_id: sensor.airthings_temperature
    above: 25.9
    id: hot
  - trigger: numeric_state
    entity_id: sensor.airthings_temperature
    below: 24.5
    id: cool
  - trigger: state
    entity_id: person.olli
    from: home
    for:
      minutes: 15
    id: away
  - trigger: state
    entity_id: person.olli
    to: home
    id: coming
  - trigger: state
    entity_id: binary_sensor.zflip7_android_auto
    to: 'on'
    id: driving
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - hot
        - coming
        - driving
      - condition: numeric_state
        entity_id: sensor.airthings_temperature
        above: 25.9
      - condition: state
        entity_id: climate.living_room_ac
        state: 'off'
      - condition: template
        value_template: '{{ is_state(''person.olli'', ''home'') != (trigger.id == ''driving'')
          }}'
      sequence:
      - action: climate.turn_on
        target:
          entity_id: climate.living_room_ac
    - conditions:
      - condition: trigger
        id:
        - cool
        - away
      - condition: not
        conditions:
        - condition: state
          entity_id: climate.living_room_ac
          state: 'off'
      sequence:
      - action: climate.turn_off
        target:
          entity_id: climate.living_room_ac
  mode: queued
- id: '1631559889262'
  alias: Cast to Google Hub
  description: ''
  use_blueprint:
    path: kind3r/cast-and-re-cast-a-lovelace-view-to-a-google-hub.yaml
    input:
      dashboard: lovelace
      player: media_player.nesthubf3b1
      view: hub
- id: '1634049171320'
  alias: Leaving Home
  description: Pause the Sonos when leaving (Welcome Home resumes it), vacuum after 10 min away (once a day),
    lights off after 15 min away. Resets the vacuum flag at 07:00.
  triggers:
  - trigger: state
    entity_id: person.olli
    from: home
    id: left
  - trigger: state
    entity_id: person.olli
    from: home
    to: not_home
    for:
      minutes: 10
    id: vacuum
  - trigger: state
    entity_id: person.olli
    from: home
    to: not_home
    for:
      minutes: 15
    id: lights
  - trigger: time
    at: 07:00:00
    id: reset
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: left
      - condition: state
        entity_id: media_player.sonos
        state: playing
      sequence:
      - action: media_player.media_pause
        target:
          entity_id: media_player.sonos
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.sonos_resume
    - conditions:
      - condition: trigger
        id: vacuum
      - condition: state
        entity_id: input_boolean.vacuumed_today
        state: 'off'
      sequence:
      - action: vacuum.start
        target:
          entity_id: vacuum.roborock_s6
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.vacuumed_today
    - conditions:
      - condition: trigger
        id: lights
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id:
          - input_boolean.lights_are_on
          - input_boolean.movie_mode_on
      - action: script.apply_lights
        data:
          scene: scene.all_off
    - conditions:
      - condition: trigger
        id: reset
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.vacuumed_today
  mode: queued
- id: '1660258947319'
  alias: Controller - IKEA E1812 TRÅDFRI Shortcut button
