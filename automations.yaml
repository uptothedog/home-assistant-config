- id: '1697483256044'
  alias: AU System Status Messenger
  description: ''
  triggers:
  - entity_id:
    - input_number.systemstatusnumber
    trigger: state
  conditions: []
  actions:
  - if:
    - condition: numeric_state
      entity_id: input_number.systemstatusnumber
      below: 1
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.systemstatushelper
      data:
        value: '{{ states(''input_text.news_helper'') }}'
    - action: input_text.set_value
      metadata: {}
      data:
        value: Nothing currently needs your attention.
      target:
        entity_id: input_text.systemstatushelper
    else:
    - choose:
      - conditions:
        - condition: numeric_state
          entity_id: input_number.systemstatusnumber
          above: 0
          below: 2
        sequence:
        - action: input_text.set_value
          target:
            entity_id: input_text.systemstatushelper
          data:
            value: '{{ states(''input_text.info_helper'') }}'
  - if:
    - condition: numeric_state
      entity_id: input_number.systemstatusnumber
      above: 0
    then:
    - data: {}
      target:
        entity_id: input_boolean.systemstatusindicators
      action: input_boolean.turn_on
    else:
    - data: {}
      target:
        entity_id: input_boolean.systemstatusindicators
      action: input_boolean.turn_off
  mode: single
