
# Configure a default setup of Home Assistant (frontend, api, etc)
default_config:

# Text to speech
tts:
  - platform: google_translate
  

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

telegram_bot:
  - platform: webhooks
    api_key: !secret telegram_api
    allowed_chat_ids:
      - !secret telegram_chat_id
      
      
notify:
  - name: Nona
    platform: telegram
    chat_id: !secret telegram_chat_id

homeassistant:
  customize: !include customize.yaml

input_boolean:
  sonos_resume:
    name: Sonos paused on leaving
    icon: mdi:play-pause
  
ifttt:
  key: !secret ifttt_api
  
light:
  - platform: group
    name: Ceiling Light
    entities:
      - light.living_room_ceiling_1
      - light.living_room_ceiling_2
      - light.living_room_ceiling_3

  - platform: group
    name: Floor Lights
    entities:
      - light.living_room_floor_1
      - light.living_room_floor_2
      
    

  
template:
  # Withings only reports the bed state when it changes, and shows "unknown"
  # in between (and after restarts). This copy keeps the last real value.
  - triggers:
      - trigger: state
        entity_id: binary_sensor.withings_in_bed
        to:
          - "on"
          - "off"
    binary_sensor:
      - name: In Bed
        unique_id: in_bed_stable
        icon: mdi:bed
        state: "{{ trigger.to_state.state == 'on' }}"

  - sensor:
      - name: "Date and time"
        state: "{{ as_timestamp(states('sensor.date_time_iso')) | timestamp_custom('%B %d, %H:%M') }}"
        icon: "mdi:calendar-clock"
        

  - sensor:
      - name: "DateLocale"
        state: "{{ as_timestamp(states('sensor.date_time_iso')) | timestamp_custom('%d.%m.%Y') }}"
        icon: "mdi:calendar-clock"
        





sensor:
  # Minimal configuration of the standard time and date sensor
  - platform: time_date
    display_options:
      - 'time'
      - 'date'
      - 'date_time'
      - 'date_time_utc'
      - 'date_time_iso'
      - 'time_date'
      - 'time_utc'
  # Build on the standard sensor to produce one that can be customized




sun:
    
    

  
frontend:
  themes: !include_dir_merge_named themes
  
  extra_module_url:
  - /hacsfiles/lovelace-card-mod/card-mod.js





    
my:

# Run by script.pull_config (the "Pull Config" script) to update /config from GitHub.
shell_command:
  git_pull: >-
    git -C /config -c safe.directory=/config
    -c core.sshCommand='ssh -i /config/.ssh/id_ed25519 -o UserKnownHostsFile=/config/.ssh/known_hosts -o StrictHostKeyChecking=accept-new'
    pull --ff-only
  # Run nightly by the "Back Up UI Edits" automation.
  backup_ui_edits: sh /config/shell/backup_ui_edits.sh

    
